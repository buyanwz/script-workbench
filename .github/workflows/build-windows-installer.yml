# 自动打 Windows 安装包：每次 push 到 main 或手动触发，在 GitHub 的 Windows 服务器上构建 NSIS 安装包并发布到 Releases。
# 注意：本文件里没有任何 Key、Token、密钥。构建只从官方地址下载 Python / ffmpeg / Pillow，并逐项校验 SHA-256 与字节数，校验失败即停下。
# v1.1.6：exe 左侧聊天栏可拖拽调宽（分界拖动、280–640px 钳制、宽度本机记忆），
# 并修复 preload 路径定位（窄边按钮与工作台视图的 electronAPI 恢复正常）；
# 工作台本体仍为 v6.03，本次不带 v6.04。
# 「同步到 GitHub」按钮仅 Muse 内部存在，不进 exe。
# latest.yml 与安装包 blockmap 仍随安装包一起传到同一个 Release，
# 否则已装的旧版查不到新版。
name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun 1.4.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Download runtimes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path resources | Out-Null
          # Python 3.12.10 embed-amd64（python.org 发布页原版）
          $pyUrl = 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip'
          $pySha = '4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3'
          Invoke-WebRequest -Uri $pyUrl -OutFile python.zip
          if ((Get-FileHash python.zip -Algorithm SHA256).Hash.ToLower() -ne $pySha) { throw 'Python SHA-256 校验失败' }
          if ((Get-Item python.zip).Length -ne 11133606) { throw 'Python 文件大小不对' }
          # ffmpeg 9.0.2 essentials（gyan.dev，带版本号直链）
          $ffUrl = 'https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.2-essentials_build.zip'
          $ffSha = '60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba'
          Invoke-WebRequest -Uri $ffUrl -OutFile ffmpeg.zip
          if ((Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower() -ne $ffSha) { throw 'ffmpeg SHA-256 校验失败' }
          if ((Get-Item ffmpeg.zip).Length -ne 114768076) { throw 'ffmpeg 文件大小不对' }
          # Pillow 13.0.0 wheel（PyPI）
          $pilUrl = 'https://files.pythonhosted.org/packages/ff/cd/73a79ecdc822076002eb24b5e1e4a530b0bb5310fcb6d239abbec877110b/pillow-13.0.0-cp312-cp312-win_amd64.whl'
          $pilSha = 'ff3fe9eb621fbb9db4c4be33ab946f6bac5f98ab50ca8d3260503653656c961b'
          Invoke-WebRequest -Uri $pilUrl -OutFile pillow.whl
          if ((Get-FileHash pillow.whl -Algorithm SHA256).Hash.ToLower() -ne $pilSha) { throw 'Pillow SHA-256 校验失败' }
          if ((Get-Item pillow.whl).Length -ne 7272166) { throw 'Pillow 文件大小不对' }

      - name: Extract runtimes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -Path python.zip -DestinationPath resources/python -Force
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-tmp -Force
          New-Item -ItemType Directory -Force -Path resources/ffmpeg | Out-Null
          Copy-Item ffmpeg-tmp/ffmpeg-9.0.2-essentials_build/bin/ffmpeg.exe resources/ffmpeg/ffmpeg.exe
          Copy-Item ffmpeg-tmp/ffmpeg-9.0.2-essentials_build/bin/ffprobe.exe resources/ffmpeg/ffprobe.exe
          Copy-Item pillow.whl pillow.zip
          Expand-Archive -Path pillow.zip -DestinationPath resources/python -Force
          if (-not (Test-Path resources/python/python.exe)) { throw 'python.exe 缺失' }
          if (-not (Test-Path resources/python/PIL)) { throw 'Pillow 解压失败（PIL 目录缺失）' }
          if (-not (Test-Path resources/ffmpeg/ffmpeg.exe)) { throw 'ffmpeg.exe 缺失' }
          if (-not (Test-Path resources/ffmpeg/ffprobe.exe)) { throw 'ffprobe.exe 缺失' }

      - name: Install dependencies
        run: bun install

      - name: Build server and client
        run: bun run build

      - name: Build Electron shell
        run: bun run electron:build

      - name: Compile Windows server exe
        run: bun build --compile --target=bun-windows-x64 ./server.ts --outfile=./resources/script-workbench-server.exe

      - name: Package NSIS installer
        run: bun x electron-builder --win nsis --x64 --publish never

      - name: Verify installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $f = Get-Item release/ScriptWorkbench-Setup-1.1.6.exe
          Write-Output "installer size: $($f.Length) bytes"
          Write-Output "installer SHA-256: $((Get-FileHash $f -Algorithm SHA256).Hash)"
          # 真实安装包约 242MB；未完成的 NSIS 壳只有约 161KB。200MB 下限既能拦住未完成品，又不会误杀正常包。
          if ($f.Length -lt 200MB) { throw "安装包太小（$($f.Length) 字节），未完成" }
          # 自动更新元数据：electron-builder 按 publish 配置生成，必须随安装包一起进 Releases，
          # 否则已装的旧版查不到新版；文件名与版本号不对也算失败。
          if (-not (Test-Path release/latest.yml)) { throw 'latest.yml 缺失，自动更新元数据没生成' }
          $ym = Get-Content release/latest.yml -Raw
          if ($ym -notmatch 'version: 1.1.6') { throw 'latest.yml 里的版本号不是 1.1.6' }
          if ($ym -notmatch 'ScriptWorkbench-Setup-1.1.6.exe') { throw 'latest.yml 里的安装包文件名不对' }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScriptWorkbench-Setup-1.1.6
          path: release/ScriptWorkbench-Setup-1.1.6.exe
          if-no-files-found: error

      - name: Publish to Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.6 release/ScriptWorkbench-Setup-1.1.6.exe --title 'ScriptWorkbench 1.1.6' --notes 'Windows 安装包（NSIS，per-user 一键安装，无需管理员权限）。本次：exe 左侧聊天栏可拖拽调宽（按住分界左右拖动，280–640px，拖好的宽度下次打开还在）；修复 preload 路径定位，窄边按钮恢复正常；工作台本体仍为 v6.03。' --target main
          if ($LASTEXITCODE -ne 0) { gh release upload v1.1.6 release/ScriptWorkbench-Setup-1.1.6.exe --clobber }
          # 自动更新元数据随安装包一起进同一 Release（差分更新用的 blockmap 有就一起传，没有也不强求）。
          gh release upload v1.1.6 release/latest.yml --clobber
          if (Test-Path release/ScriptWorkbench-Setup-1.1.6.exe.blockmap) { gh release upload v1.1.6 release/ScriptWorkbench-Setup-1.1.6.exe.blockmap --clobber }
