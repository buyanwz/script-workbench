<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>牢络生成平台公开版 · 优化 v2（LibTV 贝塞尔连线）</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0a; overflow: hidden; }
  .uv-root, .uv-root * { box-sizing: border-box; }
  .uv-root {
    height: 100vh; min-height: 560px; display: flex; flex-direction: column;
    background: #0a0a0a; color: #fafafa;
    font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
    font-size: 13px; overflow: hidden;
  }
  .uv-serif { font-family: "Songti SC", "STSong", "SimSun", serif; }
  .uv-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px; font-size: 12px; line-height: 1.5;
    border: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.05); color: #e5e5e5;
    white-space: nowrap;
  }
  .uv-chip-dot { width: 7px; height: 7px; border-radius: 50%; background: #3fa9f5; }
  .uv-chip-dot.on { background: #3ecf8e; }
  .uv-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06);
    color: #e5e5e5; border-radius: 12px; padding: 7px 14px; font-size: 12.5px; line-height: 1.4;
    cursor: pointer; transition: background .15s ease, border-color .15s ease, color .15s ease;
    font-family: inherit;
  }
  .uv-btn:hover { background: rgba(255,255,255,0.11); border-color: rgba(255,255,255,0.2); color: #fff; }
  .uv-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .uv-btn.primary {
    background: linear-gradient(135deg, #a8e5ff 0%, #3fa9f5 55%, #1f7fd4 100%);
    border-color: transparent; color: #fff; font-weight: 600;
    box-shadow: 0 6px 18px rgba(63,169,245,0.28);
  }
  .uv-btn.primary:hover:not(:disabled) { filter: brightness(1.06); }
  .uv-btn.ghost { background: transparent; border-color: transparent; padding: 6px 8px; color: #9b9ba3; }
  .uv-btn.ghost:hover { color: #fff; background: rgba(255,255,255,0.08); border-color: transparent; }
  .uv-btn.small { padding: 5px 11px; font-size: 12px; border-radius: 10px; }

  /* 顶栏 */
  .uv-top {
    flex: 0 0 auto; display: flex; align-items: center; gap: 14px;
    height: 54px; padding: 0 16px; position: relative; z-index: 60;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    background: rgba(10,10,10,0.86); backdrop-filter: blur(10px);
  }
  .uv-brand { width: 30px; height: 30px; border-radius: 9px; flex: 0 0 auto;
    background: linear-gradient(135deg, #a8e5ff 0%, #3fa9f5 60%, #1f7fd4 100%);
    display: flex; align-items: center; justify-content: center; color: #fff;
    box-shadow: 0 4px 12px rgba(63,169,245,0.35);
  }
  .uv-title { font-size: 15px; font-weight: 600; color: #fafafa; letter-spacing: .5px; }
  .uv-sub { font-size: 11.5px; color: #9b9ba3; margin-left: 2px; }
  .uv-wfid {
    font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11px;
    color: #b8b8c0; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.09);
    padding: 3px 8px; border-radius: 7px; white-space: nowrap;
  }
  .uv-top-spacer { flex: 1; }
  .uv-price-chip { font-size: 11px; color: #90dcfc; white-space: nowrap; }

  /* 线标签 */
  .uv-tabs { display: flex; gap: 6px; }
  .uv-tab {
    border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05); color: #b8b8c0;
    border-radius: 9px; padding: 4px 11px; font-size: 11.5px; cursor: pointer; font-family: inherit; position: relative;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  .uv-tab:hover { color: #fff; border-color: rgba(255,255,255,0.25); }
  .uv-tab.on { background: rgba(63,169,245,0.16); border-color: rgba(63,169,245,0.65); color: #3fa9f5; font-weight: 600; }
  .uv-tab.busy::after { content: ""; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: #3fa9f5; animation: uv-pulse 1.2s ease-in-out infinite; }

  /* 画布区 */
  .uv-canvas {
    flex: 1 1 auto; position: relative; overflow: hidden; min-height: 0;
    background-image: radial-gradient(rgba(255,255,255,0.12) 1px, transparent 1px);
    background-size: 22px 22px;
    cursor: default; touch-action: none;
  }
  .uv-canvas.panning { cursor: grabbing; }
  .uv-world { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 5; }
  .uv-canvas-hint {
    position: absolute; right: 14px; bottom: 12px; font-size: 11px; color: #6d6d76; z-index: 5;
    pointer-events: none;
  }

  /* 缩放控件 */
  .uv-zoom {
    position: absolute; right: 14px; bottom: 14px; z-index: 20;
    display: flex; align-items: center; gap: 3px; padding: 5px;
    border-radius: 12px; background: rgba(20,20,23,0.85); border: 1px solid rgba(255,255,255,0.10);
    backdrop-filter: blur(10px); box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  }
  .uv-zoom button {
    width: 26px; height: 26px; border: none; border-radius: 8px; background: transparent;
    color: #b3b3ba; cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-family: inherit; transition: background .12s ease, color .12s ease;
  }
  .uv-zoom button:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .uv-zoom input {
    width: 44px; border: none; background: rgba(0,0,0,0.32); color: #e5e5e5; border-radius: 8px;
    padding: 4px 2px; text-align: center; font-size: 11px; font-family: inherit; outline: none;
  }
  .uv-zoom-pct { font-size: 10.5px; color: #8a8a93; }

  /* 悬浮卡片（通用） */
  .uv-card {
    position: absolute; z-index: 6; border-radius: 16px; overflow: hidden;
    background: #19191c; border: 1px solid rgba(255,255,255,0.10);
    box-shadow: 0 14px 36px rgba(0,0,0,0.55);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .uv-card:hover { border-color: rgba(63,169,245,0.35); }
  .uv-card.dragging { border-color: #3fa9f5; box-shadow: 0 18px 44px rgba(0,0,0,0.7); cursor: grabbing; }
  .uv-card-head {
    display: flex; align-items: center; gap: 8px; padding: 9px 12px; cursor: grab;
    border-bottom: 1px solid rgba(255,255,255,0.07); user-select: none; touch-action: none;
  }
  .uv-card-title { flex: 1; font-size: 11.5px; font-weight: 600; letter-spacing: .5px; color: #d6d6dc; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .uv-card-count { font-size: 10.5px; color: #3fa9f5; font-weight: 600; flex: 0 0 auto; }
  .uv-card-count.full { color: #3fa9f5; }
  .uv-card-x {
    flex: 0 0 auto; width: 22px; height: 22px; border-radius: 7px; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; color: #9b9ba3; background: transparent;
  }
  .uv-card-x:hover { color: #fff; background: rgba(63,169,245,0.25); }
  .uv-card-body { padding: 12px; }

  /* 绑定徽章 */
  .uv-group-chip {
    flex: 0 0 auto; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    border: 1px solid; max-width: 86px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .uv-field-chip {
    flex: 0 0 auto; font-family: ui-monospace, Consolas, monospace; font-size: 10px; font-weight: 500;
    padding: 2px 7px; border-radius: 6px; color: #8fe3c1; background: rgba(63,220,160,0.10);
    border: 1px solid rgba(63,220,160,0.28); letter-spacing: 0;
  }
  .uv-bind-note { font-size: 10.5px; color: #6d6d76; line-height: 1.7; margin-top: 8px; }
  .uv-bind-pv {
    font-family: ui-monospace, Consolas, monospace; font-size: 10.5px; line-height: 1.75; color: #a8a8b0;
    background: rgba(0,0,0,0.32); border: 1px solid rgba(255,255,255,0.12); border-radius: 9px;
    padding: 8px 10px; margin-top: 5px; max-height: 96px; overflow: auto; white-space: pre-wrap; word-break: break-all;
  }

  /* 描述词卡 */
  .uv-pcard { width: 300px; }
  .uv-textarea {
    width: 100%; min-height: 132px; resize: vertical; border-radius: 11px; padding: 10px 11px;
    background: rgba(0,0,0,0.32); border: 1px solid rgba(255,255,255,0.12); color: #f0f0f2;
    font-family: inherit; font-size: 12.5px; line-height: 1.65; outline: none; display: block;
    transition: border-color .15s ease;
  }
  .uv-textarea.mini { min-height: 64px; font-size: 12px; }
  .uv-textarea:focus { border-color: rgba(63,169,245,0.6); }
  .uv-textarea::placeholder { color: #6d6d76; }

  /* 图片卡 */
  .uv-icard { width: 200px; cursor: grab; user-select: none; touch-action: none; }
  .uv-icard .uv-card-head { cursor: grab; }
  .uv-icard-img { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; background: #161618; }

  /* 音频卡 */
  .uv-acard { width: 240px; cursor: grab; user-select: none; touch-action: none; }
  .uv-audio-line { display: flex; align-items: center; gap: 10px; }
  .uv-audio-play {
    flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(63,169,245,0.5);
    background: rgba(63,169,245,0.14); color: #3fa9f5; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .uv-audio-play:hover { background: rgba(63,169,245,0.3); }
  .uv-audio-mid { flex: 1; min-width: 0; }
  .uv-audio-name { font-size: 11.5px; color: #cfcfd6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .uv-audio-k { font-size: 10px; color: #6d6d76; margin-top: 2px; }
  .uv-bars { display: flex; align-items: flex-end; gap: 2px; height: 20px; flex: 0 0 auto; }
  .uv-bar { width: 3px; border-radius: 1.5px; background: rgba(63,169,245,0.55); }
  .uv-bars.playing .uv-bar { animation: uv-bounce .7s ease-in-out infinite alternate; background: #3fa9f5; }
  @keyframes uv-bounce { 0% { transform: scaleY(0.25); } 100% { transform: scaleY(1); } }

  /* 角色/场景组卡 */
  .uv-gcard { width: 208px; }
  .uv-grow { display: flex; align-items: center; gap: 8px; }
  .uv-gdot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .uv-gname {
    flex: 1; min-width: 0; width: 100%; border: none; background: rgba(0,0,0,0.32);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 5px 8px;
    font-size: 12px; color: #f0f0f2; font-family: inherit; outline: none;
  }
  .uv-gname:focus { border-color: rgba(63,169,245,0.6); }
  .uv-gcount { font-size: 10.5px; color: #8a8a93; margin-top: 8px; }
  .uv-gcount b { color: #d6d6dc; font-weight: 600; }

  /* 设置卡 */
  .uv-scard { width: 288px; }
  .uv-srow { display: flex; align-items: center; gap: 10px; }
  .uv-srow + .uv-srow { margin-top: 12px; }
  .uv-slabel { flex: 0 0 52px; font-size: 11px; color: #9b9ba3; }
  .uv-range { flex: 1; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.14); outline: none; accent-color: #3fa9f5; }
  .uv-range::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 15px; height: 15px; border-radius: 50%;
    background: #3fa9f5; border: 2.5px solid #0a0a0a; box-shadow: 0 0 0 1.5px rgba(63,169,245,0.8); cursor: pointer;
  }
  .uv-dur-val { font-size: 12px; color: #3fa9f5; font-weight: 600; flex: 0 0 40px; text-align: right; }
  .uv-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .uv-pill {
    border-radius: 9px; padding: 5px 9px; font-size: 11px; cursor: pointer; font-family: inherit;
    background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.12); color: #b8b8c0;
    transition: all .15s ease;
  }
  .uv-pill:hover { border-color: rgba(255,255,255,0.26); color: #e5e5e5; }
  .uv-pill.on { background: rgba(63,169,245,0.16); border-color: rgba(63,169,245,0.65); color: #3fa9f5; font-weight: 600; }
  .uv-seed-input {
    width: 100%; border-radius: 10px; padding: 7px 10px; font-size: 11.5px;
    background: rgba(0,0,0,0.32); border: 1px solid rgba(255,255,255,0.12); color: #f0f0f2;
    outline: none; font-family: inherit;
  }
  .uv-seed-input:focus { border-color: rgba(63,169,245,0.6); }
  .uv-ptable { width: 100%; border-collapse: collapse; font-size: 11px; color: #8a8a93; }
  .uv-ptable th { text-align: left; font-weight: 500; color: #6d6d76; padding: 3px 6px; border-bottom: 1px solid rgba(255,255,255,0.08); white-space: nowrap; }
  .uv-ptable td { padding: 4px 6px; border-bottom: 1px solid rgba(255,255,255,0.05); white-space: nowrap; }
  .uv-ptable tr.cur-row td { color: #e5e5e5; }
  .uv-ptable td.cur { color: #3fa9f5; font-weight: 600; }
  .uv-price { display: flex; justify-content: space-between; font-size: 11px; color: #8a8a93; margin-top: 8px; }
  .uv-price b { color: #90dcfc; font-weight: 600; }

  /* 提示词提升卡 */
  .uv-bcard { width: 320px; }
  .uv-blabel { display: flex; justify-content: space-between; font-size: 11px; color: #9b9ba3; margin: 10px 0 6px; }
  .uv-blabel:first-child { margin-top: 0; }
  .uv-btns { display: flex; gap: 7px; margin-top: 8px; }
  .uv-boost-hint { font-size: 10.5px; color: #6d6d76; line-height: 1.7; margin-top: 9px; }

  /* 悬浮工具栏 */
  .uv-toolbar {
    position: absolute; left: 14px; bottom: 14px; z-index: 20;
    display: flex; flex-direction: column; gap: 5px; padding: 8px;
    border-radius: 16px; background: rgba(20,20,23,0.85); border: 1px solid rgba(255,255,255,0.10);
    backdrop-filter: blur(10px); box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  }
  .uv-tb-btn {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px;
    width: 54px; padding: 6px 0; border: none; background: transparent; color: #b3b3ba;
    border-radius: 10px; cursor: pointer; font-family: inherit; font-size: 9.5px; line-height: 1.2;
    transition: background .15s ease, color .15s ease;
  }
  .uv-tb-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .uv-tb-btn.on { color: #3fa9f5; background: rgba(63,169,245,0.14); }
  .uv-tb-badge {
    position: absolute; top: 2px; right: 4px; min-width: 15px; height: 15px; padding: 0 3px;
    border-radius: 8px; background: #3fa9f5; color: #fff; font-size: 9.5px; line-height: 15px; text-align: center;
    font-weight: 600;
  }
  .uv-tb-sep { height: 1px; background: rgba(255,255,255,0.08); margin: 2px 6px; }

  /* 右键菜单 */
  .uv-menu-overlay { position: fixed; inset: 0; z-index: 65; }
  .uv-menu {
    position: absolute; z-index: 70; min-width: 178px; border-radius: 13px; padding: 6px;
    background: rgba(24,24,27,0.97); border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 16px 40px rgba(0,0,0,0.65); backdrop-filter: blur(12px);
  }
  .uv-menu-head { padding: 5px 10px 3px; font-size: 10px; color: #6d6d76; letter-spacing: 1px; }
  .uv-menu-item {
    display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px;
    border: none; background: transparent; color: #d6d6dc; font-size: 12px; border-radius: 8px;
    cursor: pointer; font-family: inherit; text-align: left; transition: background .12s ease, color .12s ease;
  }
  .uv-menu-item:hover { background: rgba(63,169,245,0.14); color: #fff; }
  .uv-menu-item.danger:hover { background: rgba(229,72,77,0.18); color: #ff9d9d; }
  .uv-menu-item span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .uv-menu-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .uv-menu-sep { height: 1px; background: rgba(255,255,255,0.08); margin: 4px 8px; }

  /* 空画布引导 */
  .uv-empty {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; pointer-events: none; z-index: 2;
  }
  .uv-empty-icon {
    width: 62px; height: 62px; border-radius: 19px; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #8a8a93;
  }
  .uv-empty-title { font-size: 15px; color: #e5e5e5; letter-spacing: .5px; }
  .uv-empty-sub { font-size: 12px; color: #7c7c85; max-width: 520px; text-align: center; line-height: 1.8; }
  .uv-empty-btns { display: flex; gap: 10px; pointer-events: auto; margin-top: 4px; }

  /* 生成中悬浮条 */
  .uv-busy {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 40;
    display: flex; align-items: center; gap: 10px; padding: 9px 15px;
    border-radius: 999px; background: rgba(20,20,23,0.92); border: 1px solid rgba(63,169,245,0.4);
    box-shadow: 0 10px 28px rgba(0,0,0,0.5); backdrop-filter: blur(10px);
    font-size: 12px; color: #d9edfb;
  }
  .uv-busy-bar { width: 110px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.12); overflow: hidden; }
  .uv-busy-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, #a8e5ff, #3fa9f5); transition: width .4s ease; }

  /* 结果卡片 */
  .uv-result {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(440px, 92%); z-index: 30; border-radius: 16px; overflow: hidden;
    background: rgba(20,20,22,0.94); border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 18px 48px rgba(0,0,0,0.7); backdrop-filter: blur(12px);
  }
  .uv-result-stage { position: relative; aspect-ratio: 16/9; background: #000; }
  .uv-result-stage video { width: 100%; height: 100%; display: block; object-fit: contain; }
  .uv-kb { width: 100%; height: 100%; object-fit: cover; display: block;
    animation: uv-kb 9s ease-in-out infinite alternate; }
  @keyframes uv-kb {
    0% { transform: scale(1.03) translate(0, 0); }
    100% { transform: scale(1.14) translate(-2.2%, -1.6%); }
  }
  .uv-badge {
    position: absolute; top: 10px; left: 10px; display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 9px; border-radius: 999px; font-size: 11px; font-weight: 600;
    background: rgba(10,10,10,0.66); backdrop-filter: blur(6px); color: #fff;
  }
  .uv-badge.demo { background: rgba(63,169,245,0.2); color: #a8e5ff; border: 1px solid rgba(63,169,245,0.35); }
  .uv-badge.api { background: rgba(62,207,142,0.16); color: #7fe3b4; border: 1px solid rgba(62,207,142,0.35); }
  .uv-result-body { padding: 11px 13px; }
  .uv-result-prompt {
    font-size: 12px; color: #cfcfd6; line-height: 1.6; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .uv-result-meta { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 11px; color: #8a8a93; flex-wrap: wrap; }
  .uv-result-actions { display: flex; gap: 8px; margin-top: 10px; }
  .uv-result-close {
    position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 9px;
    border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
    background: rgba(10,10,10,0.66); color: #d6d6dc; backdrop-filter: blur(6px);
  }
  .uv-result-close:hover { color: #fff; background: rgba(63,169,245,0.35); }

  /* 底部：状态 + 历史 */
  .uv-bottom {
    flex: 0 0 auto; height: 80px; display: flex; align-items: center; gap: 16px; padding: 0 16px;
    border-top: 1px solid rgba(255,255,255,0.07); background: rgba(10,10,10,0.9); z-index: 60;
    backdrop-filter: blur(10px);
  }
  .uv-status { flex: 0 0 250px; display: flex; flex-direction: column; gap: 6px; }
  .uv-status-top { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #d6d6dc; }
  .uv-status-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .uv-status-dot.idle { background: #55555e; }
  .uv-status-dot.submitting, .uv-status-dot.running { background: #3fa9f5; animation: uv-pulse 1.2s ease-in-out infinite; }
  .uv-status-dot.success { background: #3ecf8e; }
  .uv-status-dot.failed { background: #e5484d; }
  @keyframes uv-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

- 视线引导与因果衔接（Eyeline & Action Match）：上一镜的动作或视线落点，直接作为下一镜的起幅焦点。[Shot 1] 的动作必须能触发下一镜的反应。
- 物理视听交错（J-Cut / L-Cut）：台词出来前，先让画面中的环境物理声（脚步、开门、风雪、布料）作铺垫；overall_soundscape 要写出这些铺垫声，不要只在对白当下才出现声音。
- 正确：They pause under the eaves; winter light hits their faces. After a brief beat, <Subject 3> (S2) says, <d>[Chinese] 是啊，但愿群主起来了</d>.
- 错误：At 00:04.000, <Subject 3> (S2) says, <d>...（切镜立刻对白）
- 有人发声时必须同时写出：主体标签 + 说话人编号 + 发声句式 + 对白语言和文字。
# 对白发声
- 画面内角色互相说话、问候、问答时，默认开口对白，不要改成画外音或闭口思维配音。正确：<Subject 1> (S1) says, <d>[Chinese] 师姐，我们就快要到了。</d>
- 禁止把用户没写「画外音 / 旁白 / 解说 / 内心独白 / 思维配音 / off-screen」的对白，一律写成 says in an off-screen voiceover, while their lips remain completely closed。
- 只有以下情况才写画外音：用户原文写了画外音/旁白/解说/narrator/off-screen；说话人当时不在画面内；用户点了男性/女性画外音；或台词本身是说书/旁白（如「故事就从这里开始」「欲知后事如何」）。
- 角色在画外说话：保持 <Subject N> (Sx)，并标注 off-screen。正确：<Subject 1> (S1) says off-screen, <d>[Chinese] 师姐，我们就快要到了。</d>
- 对不上已定义主体的旁白：a male narrator (S4) says in an off-screen voiceover, <d>[Chinese] 故事就从这里开始，欲知后事如何，请听下回讲解。</d>
- 仅当用户明确要求内心独白 / 思维配音 / 闭口配音时，才用：<Subject N> (Sx) says in an off-screen voiceover, while their lips remain completely closed, <d>[Language] 台词。</d>
- 禁止 shouts / shout / yells / screams。不要给开口对白加 lips remain completely closed。
- (Sx) 按成片里实际发声顺序从 (S1) 起编，同一发声源全程复用；不要在 retention_analysis 里写 (Sx)。
# 多人齐声
- 用户原文或画面明显是多人同时想同一句、齐声、一起喊、合唱同一句时，必须用复合说话人编号 (S1,S2)，不要并排写 (S1) (S2)。
- 正确：<Subject 1> and <Subject 2> (S1,S2) say, <d>[Chinese] 师姐我们一起去吧！</d>
- 中文叙述同样结构：<Subject 1> 和 <Subject 2> (S1,S2) 齐声说出，<d>[Chinese] 师姐我们一起去吧！</d>
- 错误：<Subject 1> (S1) <Subject 2> (S2) 一起说 <d>[Chinese] …</d>（这会被读成两个人先后开口）
- 禁止写成 (S1,S2) shout together 或 shouts angrily；齐声同样用 say, <d>…</d>。
- (S1,S2) 里的编号必须是各人第一次单独发声时已经分好的号，这次只复用，不新分配；同一句只写一个 <d>。
- 先后对白仍各自写 <Subject N> (Sx) says, <d>…</d>。
- 对不上已定义主体的旁白，用稳定音色描述 + (Sx)，例如 a male narrator (S4) says in an off-screen voiceover, <d>[Chinese] 故事就从这里开始。</d>
- 只有直接复用的 BGM/完整音轨里的唱词才用 <Audio N> 当声源，不要再编一个 (Sx)。
- 生成类任务按 350-500 英文词的信息量来写（中文输出时保持同等细节，不要因为换语言而变短）。对白密集时优先把台词时间线写完整，宁可按分镜反推拉长总时长，也不要为凑 5 秒或省事删对白、删分镜；自然语速大约每秒 2.5 个英文词，不要把时长塞满对白。
- overall_soundscape 只写全片环境音与现场物理声，不要写观众听到的配乐。
- non_diegetic_music 只写观众听到、角色听不到的配乐；有配乐时写乐器、速度、动态，不要只写「轻快」或「悲伤」。没有配乐写 N/A。
- 完整台词只写在 detailed_description 的 <d> 里，不要在声音两段重复整句台词。
# 角色编号映射（来自用户消息里的【素材绑定清单】，最高优先级）
- 【素材绑定清单】是权威映射：角色组按清单顺序写作 <Subject 1>、<Subject 2>……；场景组排在角色组之后继续编号，同样写作 <Subject N>。
- "ref_image_K"是"角色X" → ref_image_K 是角色X的参考图，输出里写作 <Picture K+1>；"ref_audio_K"是"角色X"的声音 → 输出里写作 <Audio K+1>，并在定义句写明这是角色X的音色来源。
- 主体标签一律只写 <Subject N>：禁止把用户中文里的 @ 名字（如 @姬子）当主体标签，禁止音译，禁止 the young woman / the girl / a woman 等代称替代标签。@ 名字只用于理解指代（哪个角色做了什么），输出时替换为对应的 <Subject N>。
- 正文里指代其它已定义主体时也写 <Subject N>，不要写 the woman / the man。
- 定义句里可在英文名后加括号保留中文原名便于识别，如 <Subject 1> is Welt (老杨) in <Picture 1>；但正文里的指代仍只用 <Subject N>。
- 若【素材绑定清单】末尾写有「无字幕无背景音乐」（最高优先级硬要求）：成片画面不得出现任何字幕/文字（no subtitles, no captions, no on-screen text），non_diegetic_music 必须写 N/A，overall_soundscape 里写明 no background music。`;

let db = null;
function idbOpen() {
  return new Promise(function (res, rej) {
    try {
      const r = indexedDB.open("ll-platform-pub", 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("kv"); };
      r.onsuccess = function () { db = r.result; res(); };
      r.onerror = function () { rej(r.error); };
    } catch (e) { rej(e); }
  });
}
function idbGet(key) {
  return new Promise(function (res) {
    if (!db) return res(null);
    try {
      const t = db.transaction("kv", "readonly").objectStore("kv").get(key);
      t.onsuccess = function () { res(t.result === undefined ? null : t.result); };
      t.onerror = function () { res(null); };
    } catch { res(null); }
  });
}
function idbSet(key, val) {
  return new Promise(function (res) {
    if (!db) return res();
    try {
      const t = db.transaction("kv", "readwrite");
      t.objectStore("kv").put(val, key);
      t.onsuccess = function () { res(); };
      t.onerror = function () { res(); };
    } catch { res(); }
  });
}

function historyForSave(s) {
  return s.history.map(function (h) {
    return Object.assign({}, h, { poster: (h.poster && h.poster.indexOf("http") === 0) ? h.poster : undefined });
  });
}
function persistAssets(s) { idbSet("assets-" + s.n, { images: s.images, audios: s.audios }); }
function persistState(s) {
  lsSet("llpub" + s.n + "-state", JSON.stringify({
    groups: s.groups,
    pos: { prompt: s.promptPos, settings: s.settingsPos, boost: s.boostPos },
    prompt: s.prompt, duration: s.duration, resolution: s.resolution, seed: s.seed, zh: s.zh, en: s.en,
    history: historyForSave(s),
    promptOpen: s.promptOpen, settingsOpen: s.settingsOpen, boostOpen: s.boostOpen,

}
function persistLayout(s) { persistAssets(s); persistState(s); }
function persistAll(s) { persistLayout(s); lsSet("llpub-token", token); lsSet("llpub-dskey", dskey); }

function loadLine(s) {
  return new Promise(function (resolve) {
    try {
      const cam = JSON.parse(lsGet("llpub" + s.n + "-camera", "null"));
      if (cam && Number.isFinite(cam.x) && Number.isFinite(cam.y) && Number.isFinite(cam.zoom)) {
        s.cam = { x: cam.x, y: cam.y, zoom: Math.min(3, Math.max(0.2, cam.zoom)) };
      }
    } catch { }
    let st = null;
    try { st = JSON.parse(lsGet("llpub" + s.n + "-state", "null")); } catch { }
    if (st) {
      if (Array.isArray(st.groups)) s.groups = st.groups;
      if (st.pos) {
        if (st.pos.prompt) s.promptPos = st.pos.prompt;
        if (st.pos.settings) s.settingsPos = st.pos.settings;
        if (st.pos.boost) s.boostPos = st.pos.boost;
      }
      if (typeof st.prompt === "string") s.prompt = st.prompt;
      if (typeof st.duration === "number") s.duration = st.duration;
      if (typeof st.resolution === "string") s.resolution = st.resolution;
      if (typeof st.seed === "string") s.seed = st.seed;
      if (typeof st.zh === "string") s.zh = st.zh;
      if (typeof st.en === "string") s.en = st.en;
      if (Array.isArray(st.history)) s.history = st.history;
      if (typeof st.promptOpen === "boolean") s.promptOpen = st.promptOpen;
      if (typeof st.settingsOpen === "boolean") s.settingsOpen = st.settingsOpen;
      if (typeof st.boostOpen === "boolean") s.boostOpen = st.boostOpen;
    }
    if (lsGet("llpub-res-768", "0") !== "1") { s.resolution = "768p横"; lsSet("llpub-res-768", "1"); }
    idbGet("assets-" + s.n).then(function (as) {
      if (as) {
        if (Array.isArray(as.images)) s.images = as.images;
        if (Array.isArray(as.audios)) s.audios = as.audios;
      }
      resolve();
    });
  });
}

function bump(s) { if (s === S()) render(); else patchTabs(); }
function setTask(s, partial) { Object.assign(s.task, partial); bump(s); }
function stopTimers(s) {
  if (s.pollTimer !== null) { clearTimeout(s.pollTimer); s.pollTimer = null; }
  s.demoTimers.forEach(function (t) { clearTimeout(t); clearInterval(t); });
  s.demoTimers = [];
}

async function submitTask(body) {
  const res = await fetch(API_BASE + SUBMIT_PATH, {
    method: "POST",
    headers: { Authorization: token, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    let detail = "";
    try {
      const j = await res.json();
      detail = String(j && (j.data && j.data.message || j.msg || j.message) || "");
    } catch { }
    throw new Error(detail ? "提交失败 HTTP " + res.status + "：" + detail : "提交失败 HTTP " + res.status);
  }
  return await res.json();
}

async function queryTask(taskId) {
  const res = await fetch(API_BASE + RESULT_PATH + taskId, { headers: { Authorization: token } });
  if (!res.ok) {
    let detail = "";
    try {
      const j = await res.json();
      detail = String(j && (j.data && j.data.message || j.msg || j.message) || "");
    } catch { }
    throw new Error(detail ? "查询失败 HTTP " + res.status + "：" + detail : "查询失败 HTTP " + res.status);
  }
  return await res.json();
}

function finishTask(s, videoUrl, prompt, meta) {
  stopTimers(s);
  setTask(s, { status: "success", progress: 100, message: "已完成", startedAt: s.task.startedAt });
  s.history.unshift({
    id: uid(), videoUrl: videoUrl, demo: false,
    poster: s.images.length ? s.images[0].url : undefined,
    prompt: prompt, meta: meta, time: Date.now(),
    status: videoUrl ? "ok" : "failed",
  });
  if (videoUrl) s.view = { videoUrl: videoUrl, demo: false, poster: s.images.length ? s.images[0].url : undefined, prompt: prompt, meta: meta, time: Date.now() };
  persistState(s);
  bump(s);
}

function failTask(s, message, prompt, meta) {
  stopTimers(s);
  setTask(s, { status: "failed", message: message, startedAt: s.task.startedAt });
  s.history.unshift({
    id: uid(), demo: false,
    poster: s.images.length ? s.images[0].url : undefined,
    prompt: prompt, meta: meta, time: Date.now(), status: "failed", message: message,
  });
  persistState(s);
  bump(s);
}

function startPolling(s, taskId, prompt, meta) {
  let attempts = 0;
  const loop = async function () {
    attempts += 1;
    if (attempts > POLL_MAX_ATTEMPTS) {
      failTask(s, "任务超时（约 1 小时），请稍后在历史中查看或重新生成", prompt, meta);
      return;
    }
    try {
      const resp = await queryTask(taskId);
      const status = String(resp.data && resp.data.status ? resp.data.status : "").toLowerCase();
      if (status === "success" || status === "completed" || status === "complete") {
        const results = (resp.data && resp.data.results) || [];
        const videoUrl = results.length && results[0] ? results[0].url : "";
        if (!videoUrl) {
          failTask(s, "任务状态已完成，但接口没有返回视频地址；请检查工作流结果字段或在服务端确认任务产物", prompt, meta);
          return;
        }
        finishTask(s, videoUrl, prompt, meta);
        return;
      }
      if (status === "failed" || status === "fail" || status === "error" || status === "cancelled") {
        failTask(s, (resp.data && resp.data.message) || resp.msg || "生成失败", prompt, meta);
        return;
      }
      const queued = status === "queued" || status === "pending";
      setTask(s, {
        status: "running",
        progress: Math.min(90, s.task.progress + (queued ? 3 : 5)),
        message: queued ? "排队中…" : "生成中…",
        startedAt: s.task.startedAt,
      });
      s.pollTimer = setTimeout(loop, POLL_INTERVAL);
    } catch (err) {
      failTask(s, (err instanceof Error ? err.message : "查询任务失败") + "（若为网络/跨域问题，见页面底部提示）", prompt, meta);
    }
  };
  loop();
}

      if (shotNums[i] !== i + 1) return "分镜编号不连续：第 " + (i + 1) + " 个分镜是 [Shot " + shotNums[i] + "]，应为 [Shot " + (i + 1) + "]，请补齐或改号后再生成";

      if (!/<Subject\s+\d+>\s*\(S\d+(,S\d+)*\)/.test(before)) {

  if (s.promptOpen) { const p = s.promptPos || { x: 48, y: 96 }; items.push({ x: p.x, y: p.y, w: 300, h: 230 }); }
  if (s.boostOpen) { const p = s.boostPos || { x: 48, y: 400 }; items.push({ x: p.x, y: p.y, w: 320, h: 430 }); }
  if (s.settingsOpen) { const p = s.settingsPos || { x: 48, y: 96 }; items.push({ x: p.x, y: p.y, w: 288, h: 300 }); }
  if (!items.length) { resetView(); return; }
  const minX = Math.min.apply(null, items.map(function (v) { return v.x; }));
  const minY = Math.min.apply(null, items.map(function (v) { return v.y; }));
  const maxX = Math.max.apply(null, items.map(function (v) { return v.x + v.w; }));
  const maxY = Math.max.apply(null, items.map(function (v) { return v.y + v.h; }));
  const rect = el.getBoundingClientRect();
  const pad = 72;
  const zoom = Math.min(1.35, Math.max(0.2, Math.min((rect.width - pad * 2) / Math.max(1, maxX - minX), (rect.height - pad * 2) / Math.max(1, maxY - minY))));
  s.cam.zoom = zoom;
  s.cam.x = (rect.width - (maxX - minX) * zoom) / 2 - minX * zoom;
  s.cam.y = (rect.height - (maxY - minY) * zoom) / 2 - minY * zoom;
  applyCam();
  lsSet("llpub" + s.n + "-camera", JSON.stringify(s.cam));
}

function cardEl(id) {
  const map = { prompt: "card-prompt", settings: "card-settings", boost: "card-boost" };
  return app.querySelector('[data-fid="' + (map[id] || ("card-" + id)) + '"]');
}
function beginDrag(e, id) {
  const s = S();
  let target = null;
  if (id === "prompt") target = s.promptPos || (s.promptPos = { x: 48, y: 96 });
  else if (id === "settings") target = s.settingsPos || (s.settingsPos = { x: Math.max(48, window.innerWidth - 360), y: 96 });
  else if (id === "boost") target = s.boostPos || (s.boostPos = { x: 48, y: 400 });
  else {
    const g = s.groups.find(function (x) { return x.id === id; });
    if (g) target = g;
    else {
      const im = s.images.find(function (x) { return x.id === id; });
      if (im) target = im;
      else {
        const a = s.audios.find(function (x) { return x.id === id; });
        if (a) target = a;
      }
    }
  }
  if (!target) return;
  e.preventDefault();
  s.drag = { id: id, lastX: e.clientX, lastY: e.clientY };
  const el0 = cardEl(id);
  if (el0) {
    el0.classList.add("dragging");
    try { el0.setPointerCapture(e.pointerId); } catch (err) { }
  }
  const move = function (ev) {
    const d = s.drag;
    if (!d || d.id !== id) return;
    const dx = (ev.clientX - d.lastX) / s.cam.zoom;
    const dy = (ev.clientY - d.lastY) / s.cam.zoom;
    d.lastX = ev.clientX; d.lastY = ev.clientY;
    target.x = Math.max(-2000, Math.min(target.x + dx, 4200));
    target.y = Math.max(-2000, Math.min(target.y + dy, 4200));
    const el2 = cardEl(id);
    if (el2) { el2.style.left = target.x + "px"; el2.style.top = target.y + "px"; }
  };
  let done = false;
  const up = function (ev) {
    if (done) return; done = true;
    // Drop an image/audio card onto a group card to bind it without opening a context menu.
    if (id !== "prompt" && id !== "settings" && id !== "boost" && ev && ev.clientX != null) {
      const isImage = s.images.some(function (x) { return x.id === id; });
      const isAudio = s.audios.some(function (x) { return x.id === id; });
      if (isImage || isAudio) {
        const groups = app.querySelectorAll(".uv-gcard");
        for (let gi = 0; gi < groups.length; gi++) {
          const r = groups[gi].getBoundingClientRect();
          if (ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom) {
            const gid = groups[gi].getAttribute("data-fid").slice(5);
            if (isImage) {
              const asset = s.images.find(function (x) { return x.id === id; });
              if (asset) asset.groupId = gid;
            } else {
              const asset = s.audios.find(function (x) { return x.id === id; });
              if (asset) asset.groupId = gid;
            }
            toast("已建立绑定关系");
            break;
          }
        }
      }
    }
    s.drag = null;
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    window.removeEventListener("pointercancel", up);
    window.removeEventListener("blur", up);
    persistLayout(s);
    render();
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
  window.addEventListener("pointercancel", up);
  window.addEventListener("blur", up);
}

function transcribePayload(s, vision) {

  const fileImgs = s.images.filter(function (im) { return im.kind === "file"; });

    ? "参考图清单（已随本条消息附上图片，请逐张分析画面）：" + urlImgs.map(function (im) { return im.name; }).join("、")
    : "参考图清单（URL，请下载查看画面后分析）：" + urlImgs.map(function (im) { return im.name + "（" + im.url + "）"; }).join("；"));
  if (fileImgs.length) lines.push(vision
    ? "本地参考图 " + fileImgs.length + " 张（已随本条消息附上图片，请逐张分析画面）。"
    : "本地参考图 " + fileImgs.length + " 张（仅存于网页本地，你这边看不到画面；如需分析外观请告诉我，我另想办法发图）。");
  if (s.audios.length) lines.push("参考音频仅用于【素材绑定清单】里的声音来源标注（不随本条消息发送音频文件）。");

  if (zhText.indexOf("【素材绑定清单】") < 0) zhText = zhText + "\n\n" + bindingText(s);

}

function bindingText(s) {
  const out = [];
  const chars = s.groups.filter(function (g) { return g.kind === "char"; });
  const scenes = s.groups.filter(function (g) { return g.kind === "scene"; });
  const order = chars.concat(scenes);
  const idxOf = {};
  order.forEach(function (g, i) { idxOf[g.id] = i + 1; });
  const imgOf = {};
  s.images.forEach(function (im, i) { imgOf[im.id] = i; });
  const audOf = {};
  s.audios.forEach(function (a, i) { audOf[a.id] = i; });
  order.forEach(function (g) {
    s.images.filter(function (im) { return im.groupId === g.id; }).forEach(function (im) {
      out.push('"ref_image_' + imgOf[im.id] + '"是"' + g.name + '"');
    });
    s.audios.filter(function (a) { return a.groupId === g.id; }).forEach(function (a) {
      out.push('"ref_audio_' + audOf[a.id] + '"是"' + g.name + '"的声音');
    });
  });
  s.images.filter(function (im) { return !idxOf[im.groupId]; }).forEach(function (im) {
    out.push('"ref_image_' + imgOf[im.id] + '"是场景/环境参考（未绑定角色）');
  });
  s.audios.filter(function (a) { return !idxOf[a.groupId]; }).forEach(function (a) {
    out.push('"ref_audio_' + audOf[a.id] + '"是环境音/独立音频（未绑定角色）');
  });
  if (order.length) {
    const map = order.map(function (g, i) { return g.name + "→<Subject " + (i + 1) + ">"; }).join("、");
    out.push("编号规则：" + map + "；\"ref_image_K\" 输出里是 <Picture K+1>；\"ref_audio_K\" 输出里是 <Audio K+1>；正文指代一律用 <Subject N>，禁止 the woman / the man 等代称。");
  } else {
    out.push("编号规则：正文指代一律用 <Subject N>，禁止 the woman / the man 等代称。");
  }
  out.push("无字幕无背景音乐");
  return "【素材绑定清单】\n" + out.join("\n");
}

function dataUrlBytes(d) {
  const i = d.indexOf("base64,");
  if (i < 0) return d.length;
  const b64 = d.slice(i + 7).replace(/=+$/, "");
  return Math.floor(b64.length * 3 / 4);
}

function imgLoadable(url) {
  return new Promise(function (res) {
    const im = new Image();
    let done = false;
    const finish = function (ok) {
      if (done) return;
      done = true;
      im.onload = im.onerror = null;
      res(ok);
    };
    im.onload = function () { finish(true); };
    im.onerror = function () { finish(false); };
    setTimeout(function () { finish(false); }, 8000);
    im.src = url;
  });
}

async function dsContent(s) {
  const parts = [{ type: "text", text: transcribePayload(s, true) }];
  let total = 0;
  let skipped = 0;
  for (let k = 0; k < s.images.length; k++) {
    const im = s.images[k];
    let bytes = 0;
    if (im.kind === "file") bytes = dataUrlBytes(im.url);
    if (bytes > DS_IMG_MAX_MB * 1024 * 1024) { skipped++; continue; }
    if (bytes && total + bytes > DS_TOTAL_MAX_MB * 1024 * 1024) { skipped++; continue; }
    if (im.kind === "url") {
      const ok = await imgLoadable(im.url);
      if (!ok) { skipped++; continue; }
    }
    if (bytes) total += bytes;
    parts.push({ type: "image_url", image_url: { url: im.url } });
  }
  if (skipped) parts.push({ type: "text", text: "（注意：有 " + skipped + " 张参考图未随消息附上——体积超限或链接无法访问，请按提示词文字与【素材绑定清单】描述处理，不要凭空编造外观。）" });
  return parts;
}

async function transcribeDeepSeek(s) {
  s.transcribing = true;
  patchUI();
  const call = async function (withImages, maxTok) {
    const userContent = withImages
      ? await dsContent(s)
      : [{ type: "text", text: transcribePayload(s, true) + "\n（附带的参考图未能被服务器读取，本次按纯文字转写；主体外观请以绑定清单与文字为准，禁止凭空编造。）" }];
    const r = await fetch(DS_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + dskey.trim() },
      body: JSON.stringify({
        model: DS_MODEL,
        messages: [
          { role: "system", content: DS_SYSTEM },
          { role: "user", content: userContent }
        ],
        temperature: 0.7,
        max_tokens: maxTok || 16384,
        thinking: { type: "disabled" },
        reasoning_effort: "none",
        response_format: { type: "json_object" }
      })
    });
    let j = null;
    try { j = await r.json(); } catch { j = {}; }
    return { r: r, j: j };
  };
  try {
    let ret = await call(true);
    if (!ret.r.ok) {
      const authOrBill = ret.r.status === 401 || ret.r.status === 402;
      const hadImages = ret.r.status === 413 || ((ret.j && ret.j.error && ret.j.error.message || "").indexOf("image") >= 0);
      if (!authOrBill && hadImages) ret = await call(false);
      if (!ret.r.ok) {
        let msg = (ret.j && ret.j.error && ret.j.error.message) ? ret.j.error.message : ("HTTP " + ret.r.status);
        if (ret.r.status === 401) msg = "DeepSeek Key 无效（检查密钥框里的 Key）";
        else if (ret.r.status === 402) msg = "DeepSeek 账户余额不足";
        else if (ret.r.status === 413) msg = "参考图太大，超出载荷上限（合计≤48MB）";
        toast("转写失败：" + msg);
        return;
      }
    }
    let fr = (ret.j && ret.j.choices && ret.j.choices[0] && ret.j.choices[0].finish_reason) || "";
    if (fr === "length") {
      const ret2 = await call(true, 32768);
      if (ret2.r.ok) ret = ret2;
    }
    fr = (ret.j && ret.j.choices && ret.j.choices[0] && ret.j.choices[0].finish_reason) || "";
    let content = (ret.j && ret.j.choices && ret.j.choices[0] && ret.j.choices[0].message && ret.j.choices[0].message.content) || "";
    content = String(content).trim().replace(/^```(json)?\s*/i, "").replace(/\s*```$/, "").trim();
    const m = content.match(/\{[\s\S]*\}/);
    if (m) content = m[0];
    s.en = content;
    persistState(s);
    render();
    toast(fr === "length" ? "转写完成，但输出疑似仍被截断——缺段落就再点一次" : "DeepSeek 转写完成 → 检查后点「应用到描述词」");
  } catch (e) {
    toast("转写失败：网络错误（" + (e && e.message ? e.message : "未知") + "）");
  } finally {
    s.transcribing = false;
    patchUI();
  }
}

function applyBoostToPrompt() {
  const s = S();
  const t = s.en.trim() || s.zh.trim();
  if (t) s.prompt = t;
  persistState(s);
  render();
}

async function downloadVideo() {
  const s = S();
  const v = s.view;
  if (!v || !v.videoUrl) return;
  const url = v.videoUrl;
  toast("开始下载视频…");
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error("http " + r.status);
    const b = await r.blob();
    const u = URL.createObjectURL(b);
    const a = document.createElement("a");
    a.href = u;
    a.download = "牢络_" + ts2str(Date.now()) + ".mp4";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(u); }, 60000);
  } catch (e) {
    toast("直链下载被拦，已在新标签页打开（可在播放器右键另存为）");
    window.open(url, "_blank");
  }
}

function toast(msg) {
  const t = document.createElement("div");
  t.className = "uv-toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, 2600);
}

function busyOf(s) { return s.task.status === "submitting" || s.task.status === "running"; }
function dragCls(s, id) { return s.drag && s.drag.id === id ? " dragging" : ""; }

function tabsHtml() {
  let out = "";
  for (let i = 0; i < L.length; i++) {
    const b = busyOf(L[i]);
    out += '<button class="uv-tab' + (i === cur ? " on" : "") + (b ? " busy" : "") + '" data-fid="tab-' + i + '" onclick="switchLine(' + i + ')">' +
      (b ? "线 " + (i + 1) + " · " + Math.round(L[i].task.progress) + "%" : "线 " + (i + 1)) + "</button>";
  }
  return out;
}

function statusHtml(s) {
  const ready = token.trim().length > 0;
  const t = s.task;
  let main = "";
  if (t.status === "idle") main = ready ? "就绪 · 等待生成" : "就绪 · 公开版演示模式";
  else if (t.status === "submitting") main = t.message;
  else if (t.status === "running") main = t.message + " " + Math.round(t.progress) + "%";
  else if (t.status === "success") main = t.message;
  else if (t.status === "failed") main = "失败";
  let prog = "";
  if (t.status === "submitting" || t.status === "running") {
    prog = '<div class="uv-progress"><div class="uv-progress-fill" style="width:' + t.progress + '%"></div></div>';
  }
  let note = "";
  if (t.status === "failed") note = '<div class="uv-status-note" style="color:#e5484d">' + esc(t.message) + "</div>";
  else if (t.startedAt > 0) {
    note = '<div class="uv-status-note">' +
      (t.status === "success" ? "耗时 " + fmtElapsed(Date.now() - t.startedAt) + " · " : "") +
      (ready ? "API 直连模式 · 无沙箱" : "公开版演示模式 · 免费不花钱 · 点右上角 Token 填自己的令牌即可真实生成") + "</div>";
  }
  return '<div class="uv-status-top"><span class="uv-status-dot ' + t.status + '"></span><span>' + main + "</span></div>" + prog + note;
}

      '<tr data-fid="pt-row-768" class="' + (s.resolution.startsWith("768") ? "cur-row" : "") + '"><td data-fid="pt-cell-768" class="' + (s.resolution.startsWith("768") ? "cur" : "") + '">768p</td><td>' + fmtPerSec(0.04) + "</td><td>" + fmtPerSec(0.03) + "</td></tr>" +
      "</tbody></table>" +
      '<div class="uv-price" data-fid="price-est"><span>本次预计（' + s.duration + "s）</span><b>" + fmtPrice(rate.peak * s.duration) + " 高峰 / " + fmtPrice(rate.off * s.duration) + " 空闲</b></div>" +
      "</div></div></div>";
  }
  return out;
}

function resultHtml(s) {

function render() {
  const s = S();
  const busy = busyOf(s);
  const ready = token.trim().length > 0;
  const canGen = s.prompt.trim().length > 0 && s.images.length > 0 && !busy;
  const rate = rateFor(s.resolution);
  const view = s.view;

  if (!s.promptPos) s.promptPos = { x: 48, y: 96 };
  if (!s.boostPos) s.boostPos = { x: 48, y: 400 };
  if (!s.settingsPos) s.settingsPos = { x: Math.max(48, window.innerWidth - 360), y: 96 };

  const ae = document.activeElement;
  const fid = ae && ae.getAttribute ? ae.getAttribute("data-fid") : null;
  let sel = null;
  if (fid && (ae.tagName === "TEXTAREA" || ae.tagName === "INPUT")) {
    try { sel = { s: ae.selectionStart, e: ae.selectionEnd }; } catch { }
  }

  let html = '<div class="uv-root">';

  html += '<header class="uv-top">' +
    '<div class="uv-brand">' + icon("spark", 17) + "</div>" +
    '<div><div class="uv-title uv-serif">牢络生成平台公开版</div><div class="uv-sub">MiniMax H3 · 直连 autodl.art · 四线并行 · 演示免费</div></div>' +
    '<div class="uv-tabs">' + tabsHtml() + "</div>" +
    '<span class="uv-wfid">' + WORKFLOW_ID + "</span>" +
    '<div class="uv-top-spacer"></div>' +
    (busy ? "" : '<span class="uv-price-chip" data-fid="price-chip">预计 ' + fmtPrice(rate.peak * s.duration) + "（高峰）/ " + fmtPrice(rate.off * s.duration) + "（空闲）</span>") +
    '<span class="uv-chip" style="cursor:pointer" onclick="openTokenDialog()" title="点击配置 API Token 与 DeepSeek Key"><span class="uv-chip-dot' + (ready ? " on" : "") + '"></span>' + (ready ? "API 已就绪" : "演示模式") + "</span>" +
    '<button class="uv-btn" onclick="openCopyAssets()" title="把当前线的参考图与角色/场景绑定复制到其它线">' + icon("copy", 14) + " 复制素材</button>" +
    '<button class="uv-btn" onclick="openTokenDialog()">' + icon("gear", 14) + " 密钥</button>" +
    '<button class="uv-btn primary" data-fid="gen-btn" ' + (canGen ? "" : "disabled") + ' onclick="generate()" title="' +
    (canGen ? "" : (s.prompt.trim() ? "请至少添加 1 张参考图" : "请先填写描述词")) + '">' + icon("spark", 15) +
    '<span data-fid="gen-t">' + (busy ? (s.task.status === "submitting" ? "提交中…" : "生成中 " + Math.round(s.task.progress) + "%") : "生成视频") + "</span></button>" +
    "</header>";

  html += '<main class="uv-canvas' + (s.panning ? " panning" : "") + '" data-fid="canvas" ' +
    'style="background-size:' + (22 * s.cam.zoom) + "px " + (22 * s.cam.zoom) + "px;background-position:" + s.cam.x + "px " + s.cam.y + 'px" ' +
    'onpointerdown="canvasDown(event)" ondblclick="canvasDbl(event)" oncontextmenu="canvasCtx(event)" onwheel="wheelZoom(event)">' +
    '<input class="uv-hidden-input" type="file" id="uv-img-input" accept="image/jpeg,image/png,image/webp" multiple onchange="handleFiles(this.files,\'image\');this.value=\'\';">' +
    '<input class="uv-hidden-input" type="file" id="uv-audio-input" accept="audio/mpeg,audio/wav,audio/mp4,audio/flac,audio/*" multiple onchange="handleFiles(this.files,\'audio\');this.value=\'\';">' +
    '<div class="uv-world" style="transform:translate(' + s.cam.x + "px," + s.cam.y + "px) scale(" + s.cam.zoom + ');transform-origin:0 0">' +
    bindLinesHtml(s) + cardsHtml(s) + "</div>" +
    (view ? resultHtml(s) : "") +
    (!view && s.images.length === 0 && !busy
      ? '<div class="uv-empty"><div class="uv-empty-icon">' + icon("film", 28) + '</div>' +
        '<div class="uv-empty-title uv-serif">把素材拖进来，自由排版</div>' +
        '<div class="uv-empty-sub">参考图与参考音频都会变成画布上的卡片，按住即可拖动。右键画布打开菜单：传素材、新建角色/场景；右键素材卡可绑定角色或场景，绑定后卡片会出现彩色徽章。双击空白处也能加图。公开版为四线并行：顶部可切换线 1–4 同时跑任务。公开版不内置 Token，默认演示模式免费走流程、不出真视频；右上角填自己的 Token 可真实生成。</div>' +
        '<div class="uv-empty-btns">' +
        '<label class="uv-btn primary" for="uv-img-input" style="cursor:pointer">' + icon("image", 14) + " 上传参考图</label>" +
        '<label class="uv-btn" for="uv-audio-input" style="cursor:pointer">' + icon("music", 14) + " 上传参考音频</label>" +
        "</div></div>"
      : "") +
    (busy
      ? '<div class="uv-busy"><span>' + esc(s.task.message) + '</span><div class="uv-busy-bar"><div class="uv-busy-fill" style="width:' + s.task.progress + '%"></div></div>' +
        '<span style="color:#90dcfc;font-weight:600">' + Math.round(s.task.progress) + "%</span></div>"
      : "") +
    toolbarHtml(s) +
    menuHtml(s) +
    zoomHtml(s) +
    '<div class="uv-canvas-hint">右键菜单 · 双击传图 · 拖空白平移 · 滚轮缩放 · 拖素材到角色/场景卡可快速绑定 · F 适配画布 · 直连 API</div>' +
    "</main>";

  html += '<footer class="uv-bottom">' +
    '<div class="uv-status" data-fid="status-area">' + statusHtml(s) + "</div>" +
    '<div class="uv-hist-sep"></div>' +
    '<span class="uv-hist-label">创作记录</span>' +
    '<div class="uv-hist">' + historyHtml(s) + "</div>" +
    "</footer>";

  html += dialogsHtml(s);
  html += "</div>";

  app.innerHTML = html;

  if (fid) {
    const el = app.querySelector('[data-fid="' + fid + '"]');
    if (el) {
      el.focus();
      if (sel && el.setSelectionRange) {
        try { el.setSelectionRange(sel.s, sel.e); } catch { }
      }
    }
  }
}

function patchUI() {
  const s = S();
  const set = function (fid, fn) {
    const el = app.querySelector('[data-fid="' + fid + '"]');
    if (el) fn(el);
  };
  set("prompt-count", function (el) {
    el.textContent = s.prompt.length > 0 ? s.prompt.length + " / 10000" : "必填";
    el.className = "uv-card-count" + (s.prompt.length > 0 ? "" : " full");
  });
  set("zh-count", function (el) { el.textContent = s.zh.length + " 字"; });
  set("bind-pv", function (el) { el.textContent = bindingText(s); });
  set("en-count", function (el) { el.textContent = s.en.length + " 字"; });
  set("dur-val", function (el) { el.textContent = s.duration + "s"; });
  const rate = rateFor(s.resolution);
  set("price-chip", function (el) {
    el.textContent = "预计 " + fmtPrice(rate.peak * s.duration) + "（高峰）/ " + fmtPrice(rate.off * s.duration) + "（空闲）";
  });
  set("price-est", function (el) {
    el.innerHTML = "<span>本次预计（" + s.duration + "s）</span><b>" + fmtPrice(rate.peak * s.duration) + " 高峰 / " + fmtPrice(rate.off * s.duration) + " 空闲</b>";
  });
  RES_OPTIONS.forEach(function (r) {
    set("pill-" + r, function (el) { el.className = "uv-pill" + (s.resolution === r ? " on" : ""); });
  });
  set("pt-row-480", function (el) { el.className = s.resolution.startsWith("480") ? "cur-row" : ""; });
  set("pt-cell-480", function (el) { el.className = s.resolution.startsWith("480") ? "cur" : ""; });
  set("pt-row-768", function (el) { el.className = s.resolution.startsWith("768") ? "cur-row" : ""; });
  set("pt-cell-768", function (el) { el.className = s.resolution.startsWith("768") ? "cur" : ""; });
  const busy = busyOf(s);
  const canGen = s.prompt.trim().length > 0 && s.images.length > 0 && !busy;
  set("gen-btn", function (el) {
    el.disabled = !canGen;
    el.title = canGen ? "" : (s.prompt.trim() ? "请至少添加 1 张参考图" : "请先填写描述词");
  });
  set("gen-t", function (el) {
    el.textContent = busy ? (s.task.status === "submitting" ? "提交中…" : "生成中 " + Math.round(s.task.progress) + "%") : "生成视频";
  });
  set("transcribe", function (el) { el.disabled = !s.zh.trim() || s.transcribing; });
  set("transcribe-t", function (el) { el.textContent = s.transcribing ? "转写中…" : "一键转写"; });
  set("copy-zh", function (el) { el.disabled = !s.zh.trim(); });
  set("copy-zh-t", function (el) { el.textContent = s.copiedZh ? "已复制" : "复制中文"; });
  set("copy-en", function (el) { el.disabled = !s.en.trim(); });
  set("copy-en-t", function (el) { el.textContent = s.copiedEn ? "已复制" : "复制英文"; });
  set("apply-en", function (el) { el.disabled = !(s.en.trim() || s.zh.trim()); });
  set("link-copy-t", function (el) { el.textContent = s.copied ? "已复制" : "复制链接"; });
}

function patchTabs() {
  for (let i = 0; i < L.length; i++) {
    const el = app.querySelector('[data-fid="tab-' + i + '"]');
    if (!el) continue;
    const b = busyOf(L[i]);
    el.className = "uv-tab" + (i === cur ? " on" : "") + (b ? " busy" : "");
    el.textContent = b ? "线 " + (i + 1) + " · " + Math.round(L[i].task.progress) + "%" : "线 " + (i + 1);
  }
}

function patchStatus() {
  const s = S();
  const st = app.querySelector('[data-fid="status-area"]');
  if (st) st.innerHTML = statusHtml(s);
  const gt = app.querySelector('[data-fid="gen-t"]');
  if (gt) {
    const busy = busyOf(s);
    gt.textContent = busy ? (s.task.status === "submitting" ? "提交中…" : "生成中 " + Math.round(s.task.progress) + "%") : "生成视频";
  }
}

// 切换线 / 启动
// ─────────────────────────────────────────────────────────────
async function switchLine(n) {
  if (switching || n === cur) return;
  switching = true;
  const old = S();
  if (old.audioObj) { old.audioObj.pause(); old.audioObj = null; }
  old.playing = null;
  persistAll(old);
  cur = n;
  lsSet("llpub-line", String(n));
  await loadLine(S());
  switching = false;
  render();
}

(async function () {
  try { await idbOpen(); } catch { }
  const savedLine = parseInt(lsGet("llpub-line", "0"), 10);
  cur = Number.isNaN(savedLine) ? 0 : Math.min(L.length - 1, Math.max(0, savedLine));
  await loadLine(S());
  render();
  setInterval(function () { patchStatus(); patchTabs(); }, 1000);
  window.addEventListener("keydown", function (e) {
    const tag = e.target && e.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || (e.target && e.target.isContentEditable)) return;
    if (e.key === "f" || e.key === "F") { e.preventDefault(); fitView(); }
    else if (e.key === "0") { e.preventDefault(); resetView(); }
    else if (e.key === "Escape") {
      const st = S();
      if (st.menu || st.dialogOpen || st.urlDialogOpen || st.copyOpen) {
        st.menu = null; st.dialogOpen = false; st.urlDialogOpen = false; st.copyOpen = false;
        render();
      }
    }
  });
  window.addEventListener("beforeunload", function () {
    persistAll(S());
    lsSet("llpub" + S().n + "-camera", JSON.stringify(S().cam));
  });
})();
</script>
