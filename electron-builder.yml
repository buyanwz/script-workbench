# electron-builder 打包配置（P1 定稿；真正打安装包是 P6）。
#
# 目标（port-plan.md D1/D6）：Windows exe，NSIS per-user 安装（不用管理员权限），
# 数据目录与程序目录分离（数据在 %APPDATA%\ScriptWorkbench，卸载不删数据）。
# 注意：
#   - resources/python/ 与 resources/ffmpeg/（内嵌 Python + ffmpeg）是 P4 才打包，
#     本阶段 extraResources 里先不列不存在的目录，打包时缺目录会报错；
#     P4 接线时把下面两行取消注释。
#   - Windows 安装包须在 Windows 上打（或 Linux + wine）；本机 Linux 沙箱
#     只验证壳的运行逻辑，不出 NSIS 包（见 p1-report.md）。
appId: com.scriptworkbench.app
productName: 剧本创作工作台
copyright: Copyright © 2026

# v1.1.0 自动更新：更新源 = GitHub Releases（buyanwz/script-workbench）。
# electron-builder 打包时按此配置生成 latest.yml（放 release/，由工作流
# 随安装包一起传到 Releases）与 app-update.yml（放程序 resources/ 内，
# 供 electron-updater 运行时读更新源）；--publish never 只跳过上传，
# 不影响这两个文件的生成（沙箱 Linux 构建已实测，见 github-actions-report §十三）。
publish:
  provider: github
  owner: buyanwz
  repo: script-workbench

directories:
  output: release

files:
  - electron/dist/**
  - package.json

extraResources:
  # 服务端编译产物（P1 已验证 bun build --compile；P6 打包时由构建脚本生成后放这里）
  - from: resources/script-workbench-server.exe
    to: script-workbench-server.exe
  # 数据库迁移（P2）：服务端启动时按 drizzle/meta/_journal.json 跑 40 个迁移；
  # 打包后 exe 在 resources/ 下，drizzle/ 必须随包放在 resources/drizzle/，
  # 否则服务端一启动就 fatal 停服（v1.0.1 沙箱验证发现：v1.0.0 的包里就没有它）。
  - from: drizzle
    to: drizzle
  # 前端构建产物（P1 已验证 client/dist 同源托管）
  - from: client/dist
    to: client/dist
  # P4 已启用：内嵌 Python + ffmpeg 随安装包分发（见 python-runtime.ts）。
  - from: resources/python
    to: python
  - from: resources/ffmpeg
    to: ffmpeg

win:
  # v1.0.1：正式图标（build/icon.ico，暖纸底＋场记板）；之前没配 icon，构建日志
  # 明确写了 "default Electron icon is used"，安装包和程序都用的 Electron 默认图标。
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: ScriptWorkbench-Setup-${version}.exe

nsis:
  oneClick: true
  perMachine: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # v1.1.1：安装程序界面改中文（原来默认英文）：installerLanguages 只留
  # 简体中文（electron-builder 认 zh_CN → NSIS SimpChinese），language 2052
  # 是简体中文的 LCID（版本信息语言）；单语言不弹语言选择框。
  installerLanguages: ["zh_CN"]
  language: "2052"
  # allowToChangeInstallationDirectory 只能用于非 oneClick（assisted）安装器；
  # oneClick 安装器无目录选择页，P1 原稿的 true 会被 electron-builder 校验拒绝，
  # 故删除该行（P6 实测结论）。
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # 卸载只删程序目录，不动 %APPDATA%\ScriptWorkbench 数据目录（D3）。
  deleteAppDataOnUninstall: false

# 便携版（P6 时再定做不做；先留口径）
# portable:
#   artifactName: ScriptWorkbench-Portable-${version}.zip
